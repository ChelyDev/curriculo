name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Test - check Cybersecurity in index.astro
        run: grep -q "Cybersecurity" src/pages/index.astro && echo "OK" || (echo "Cybersecurity not found in index.astro" && exit 1)


